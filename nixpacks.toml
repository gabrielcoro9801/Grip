# Config per Railway/Nixpacks.
#
# Un servizio solo serve tutto: le pagine dell'applicazione e l'API, sullo
# stesso indirizzo. Costa un po' in prestazioni rispetto a una CDN — irrilevante
# per un gestionale usato da qualche persona — e in cambio toglie di mezzo il
# CORS (nessuna chiamata fra domini diversi), un secondo pannello e un secondo
# dominio da tenere allineato.
#
# Il "Root Directory" nel pannello Railway va lasciato **vuoto**: il backend sta
# in server/ ma importa da shared/, un livello sopra, e il frontend va costruito
# dalla radice. Puntando la root su server/ si romperebbero entrambe le cose.

[phases.setup]
# Il frontend serve solo a produrre dist/: le sue dipendenze non finiscono
# nell'immagine finale, ma servono durante la build.
nixPkgs = ["nodejs"]

[phases.install]
cmds = [
  "npm install",
  "npm install --prefix server --omit=dev",
]

[phases.build]
# Produce dist/, che il server pubblica come sito. Senza questo passaggio
# l'applicazione risponderebbe solo sull'API e il dominio mostrerebbe un 404.
cmds = ["npm run build"]

# Le migrazioni si applicano a ogni rilascio, prima di accettare richieste.
#
# Due ragioni per farlo qui e non a mano: una modifica allo schema arriva in
# produzione solo così, e un server avviato su uno schema vecchio risponderebbe
# con errori incomprensibili invece di non partire affatto. `db:deploy` usa il
# migratore incluso in drizzle-orm, non drizzle-kit, che con --omit=dev non
# viene installato.
[start]
cmd = "npm --prefix server run db:deploy && node server/src/index.js"
